name: Tests

on:
  push:
    branches:
      - master
      - develop
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml'
      - '.github/workflows/tests.yml'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  test:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3']
        laravel: ['5.8.*', '6.*', '7.*', '8.*', '9.*', '10.*', '11.*']
        stability: [prefer-stable]

        include:
          # Laravel to Testbench version mapping
          - laravel: 11.*
            testbench: ^10.0
          - laravel: 10.*
            testbench: ^9.0
          - laravel: 9.*
            testbench: ^8.0
          - laravel: 8.*
            testbench: ^7.0
          - laravel: 7.*
            testbench: ^6.0
          - laravel: 6.*
            testbench: ^5.0
          - laravel: 5.8.*
            testbench: ^4.0

          # PHP to PHPUnit version mapping
          - php: '7.2'
            phpunit: ^8.5
          - php: '7.3'
            phpunit: ^9.0
          - php: '7.4'
            phpunit: ^9.0
          - php: '8.0'
            phpunit: ^9.5
          - php: '8.1'
            phpunit: ^10.0
          - php: '8.2'
            phpunit: ^11.0
          - php: '8.3'
            phpunit: ^11.0

        exclude:
          # Laravel 11.x requires PHP 8.2+ (excluding incompatible PHP < 8.2)
          - laravel: 11.*
            php: '7.2'
          - laravel: 11.*
            php: '7.3'
          - laravel: 11.*
            php: '7.4'
          - laravel: 11.*
            php: '8.0'
          - laravel: 11.*
            php: '8.1'

          # Laravel 10.x requires PHP 8.1+ (excluding incompatible PHP < 8.1)
          - laravel: 10.*
            php: '7.2'
          - laravel: 10.*
            php: '7.3'
          - laravel: 10.*
            php: '7.4'
          - laravel: 10.*
            php: '8.0'

          # Laravel 9.x requires PHP 8.0+ (excluding incompatible PHP < 8.0)
          - laravel: 9.*
            php: '7.2'
          - laravel: 9.*
            php: '7.3'
          - laravel: 9.*
            php: '7.4'

          # Laravel 8.x supports PHP 7.3-8.1 (excluding PHP 7.2 and 8.2+)
          - laravel: 8.*
            php: '7.2'
          - laravel: 8.*
            php: '8.2'
          - laravel: 8.*
            php: '8.3'

          # Laravel 7.x supports PHP 7.2-8.1 (excluding PHP 8.2+)
          - laravel: 7.*
            php: '8.2'
          - laravel: 7.*
            php: '8.3'

          # Laravel 6.x supports PHP 7.2-8.1 (excluding PHP 8.2+)
          - laravel: 6.*
            php: '8.2'
          - laravel: 6.*
            php: '8.3'

          # Laravel 5.8.x supports PHP 7.2-7.4 (excluding PHP 8.0+)
          - laravel: 5.8.*
            php: '8.0'
          - laravel: 5.8.*
            php: '8.1'
          - laravel: 5.8.*
            php: '8.2'
          - laravel: 5.8.*
            php: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Add PHPUnit problem matcher
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Execute tests
        run: vendor/bin/phpunit
